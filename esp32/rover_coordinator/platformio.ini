; Waveshare General Driver for Robots - rover hardware coordinator.
; I2C: SDA=GPIO32 SCL=GPIO33. WiFi secrets via include/wifi_secrets.h (gitignored).
; Device IPs: devices.json (front / rear). Same app firmware; OTA hostname differs.

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
  ArduinoOTA

; --- Front board (Maix UART4 → IO4/IO5) ------------------------------------
[env:waveshare_front]
build_flags =
  -DARDUINO_OTA_HOSTNAME=\"maixairover-front\"

[env:waveshare_front_ota]
extends = env:waveshare_front
upload_protocol = espota
upload_port = 192.168.20.148

; --- Rear board (Maix UART2 → IO4/IO5) -------------------------------------
[env:waveshare_rear]
build_flags =
  -DARDUINO_OTA_HOSTNAME=\"maixairover-rear\"

[env:waveshare_rear_ota]
extends = env:waveshare_rear
upload_protocol = espota
; upload_port from devices.json / CLI --upload-port

; --- Legacy aliases (same as front) ----------------------------------------
[env:waveshare_esp32]
extends = env:waveshare_front

[env:waveshare_esp32_ota]
extends = env:waveshare_front_ota
