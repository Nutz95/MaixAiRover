; Waveshare General Driver for Robots - rover hardware coordinator.
; I2C: SDA=GPIO32 SCL=GPIO33. WiFi secrets via include/wifi_secrets.h (gitignored).

[env:waveshare_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder
lib_deps =
  ArduinoOTA
build_flags =
  -DARDUINO_OTA_HOSTNAME=\"maixairover-esp\"

; OTA upload: pio run -e waveshare_esp32_ota -t upload --upload-port <ip>
[env:waveshare_esp32_ota]
extends = env:waveshare_esp32
upload_protocol = espota
; upload_port set on CLI: --upload-port 192.168.x.x
